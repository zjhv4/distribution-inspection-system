[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-inspection"
version = "0.1.0"
description = "Edge vision inspection for distribution room intrusion and breaker-state alerts"
requires-python = ">=3.10"
dependencies = [
  "lap>=0.5.12",
  "numpy>=2.2,<2.3",
  "opencv-python==4.12.0.88",
  "PyYAML>=6.0",
  "requests>=2.31",
  "safetensors>=0.4",
  "timm>=1.0",
  "ultralytics>=8.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["edge_inspection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
